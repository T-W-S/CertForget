services:
  api:
    build:
      context: ./artifacts/certforge-t/backend
      dockerfile: Dockerfile
    environment:
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      OPENSSL_TIMEOUT_SECONDS: ${OPENSSL_TIMEOUT_SECONDS:-10}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/certforge-api/health', timeout=3)"
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: artifacts/certforge-t/Dockerfile.web
    ports:
      - "${CERTFORGE_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=8m
      - /var/run:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=4m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
